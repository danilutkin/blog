<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Three.js Model Picker (Turbine + Solar System)</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0a0f1a; color: #eef2ff; }
    #app { position: fixed; inset: 0; }
    #viewport { width: 100%; height: 100%; display: block; }
    .toolbar {
      position: fixed; top: 16px; left: 16px; z-index: 10;
      background: rgba(10,15,26,0.78); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px; padding: 10px 12px; backdrop-filter: blur(6px);
      display: flex; gap: 10px; align-items: center;
    }
    .toolbar select, .toolbar input {
      background: #121a2b; color: #eef2ff; border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px; padding: 6px 8px;
    }
    .toolbar label { font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="viewport"></canvas>
  </div>

  <div class="toolbar">
    <label for="modelPicker">Model:</label>
    <select id="modelPicker">
      <option value="turbine">turbine blade</option>
      <option value="solar">solar system</option>
    </select>

    <label for="speed">Speed:</label>
    <input id="speed" type="range" min="0" max="5" step="0.1" value="1" />
    <span id="speedValue">1.0x</span>
  </div>

  <script type="module" src="js/viewer/main.js"></script>
</body>
</html>
